name: CI y despliegue

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas
        run: ./mvnw -B verify

  deploy:
    name: Desplegar en Dokploy
    needs: test
    # Solo se despliega desde main (producción) o dev (desarrollo), nunca desde un PR.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Disparar el webhook de Dokploy
        env:
          # Las URLs del webhook son secretas: se guardan en Settings → Secrets and variables → Actions.
          WEBHOOK: ${{ github.ref == 'refs/heads/main' && secrets.DOKPLOY_WEBHOOK_PROD || secrets.DOKPLOY_WEBHOOK_DEV }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Falta el secreto DOKPLOY_WEBHOOK_PROD / DOKPLOY_WEBHOOK_DEV"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$WEBHOOK"
          echo "Despliegue solicitado a Dokploy."
